# Build the Windows-native ncc.exe and publish it so downstream bakes can consume
# it. This is the bootstrap that unblocks racecar's Windows build+sign runner
# (racecar#120): its packer bake stages ncc.exe from `gh run download` (CI
# artifact) or `gh release download` (release asset, ncc-*-windows-x64.exe).
# Builds on a GitHub-hosted windows-latest — hosted runners CAN build ncc; the
# dedicated racecar runner is for the pinned toolchain + ETW, not a build
# prerequisite — so this has no circular dependency on the box it helps provision.
#
# COMPILER: ncc's meson.build hard-requires Clang (c_std=gnu23 + C23 #embed /
# --embed-dir; it error()s on non-Clang). MSVC cl.exe is NOT usable. Per the repo
# README + toolchains/windows-x86_64-clang.ini, the Windows build uses the
# llvm-mingw Clang 22.1.0+ toolchain via `--cross-file`, invoking meson directly
# (build.ps1 auto-injects -Db_vscrt=md, which is invalid for the windows-gnu
# target).
name: windows-ncc-build

on:
  push:
    branches: [baron/windows]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write   # attach the .exe to a release when one triggers this

env:
  # llvm-mingw 20260616 == Clang 22.1.8 (satisfies the >=22.1.0 toolchain gate).
  LLVM_MINGW_TAG: "20260616"
  LLVM_MINGW_ZIP: "llvm-mingw-20260616-ucrt-x86_64.zip"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install meson + ninja
        run: python -m pip install --upgrade meson ninja

      # llvm-mingw Clang (the toolchain the cross file + README require). Put its
      # bin dir at the FRONT of PATH so meson picks this clang over any stock one.
      - name: Install llvm-mingw Clang toolchain
        shell: pwsh
        run: |
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_TAG/$env:LLVM_MINGW_ZIP"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm-mingw.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\llvm-mingw.zip" -DestinationPath "C:\llvm-mingw" -Force
          $bin = (Get-ChildItem "C:\llvm-mingw" -Directory | Select-Object -First 1).FullName + "\bin"
          Write-Host "llvm-mingw bin: $bin"
          # Prepend to PATH for all subsequent steps.
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\clang.exe" --version

      # meson setup + compile per README: CC=clang + the repo's cross file →
      # build-win\ncc.exe. Release build.
      - name: Build ncc.exe (llvm-mingw Clang, release)
        shell: pwsh
        env:
          CC: clang
        run: |
          meson setup build-win --buildtype=release --cross-file toolchains/windows-x86_64-clang.ini
          meson compile -C build-win
          if (-not (Test-Path build-win\ncc.exe)) { throw "build-win\ncc.exe not produced" }

      - name: Smoke — ncc.exe runs
        shell: pwsh
        run: |
          & .\build-win\ncc.exe --version
          if ($LASTEXITCODE -ne 0) { throw "ncc.exe --version exited $LASTEXITCODE" }

      - name: Stage named asset
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,8)
          Copy-Item build-win\ncc.exe "ncc-$sha-windows-x64.exe"
          "NCC_ASSET=ncc-$sha-windows-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # CI artifact — racecar's packer bake pulls this via `gh run download`
      # (default ncc_ref = latest successful baron/windows build).
      - name: Upload ncc.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncc-windows-x64
          path: |
            ${{ env.NCC_ASSET }}
            build-win/meson-logs/meson-log.txt
          if-no-files-found: error
          retention-days: 90

      # Release asset — the documented `gh release download -p 'ncc-*-windows-x64.exe'` path.
      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.NCC_ASSET }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
