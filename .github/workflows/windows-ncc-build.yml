# Build the Windows-native ncc.exe and publish it so downstream bakes can consume
# it. Unblocks racecar's Windows build+sign runner (racecar#120): the packer bake
# stages ncc.exe from `gh run download` (CI artifact) or `gh release download`
# (ncc-*-windows-x64.exe).
#
# Toolchain: llvm-mingw Clang (the cross file toolchains/windows-x86_64-clang.ini
# targets x86_64-w64-windows-gnu and the build requires Clang 22.1.0+ for C23
# `#embed`). MSVC cannot build this (meson `c_std=gnu23` is unsupported by cl.exe).
# Runs on hosted windows-latest — no dependency on the box this helps provision.
name: windows-ncc-build

on:
  push:
    branches: [baron/windows]
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

env:
  # llvm-mingw 20260616 ships LLVM 22.1.8 — satisfies the cross file's Clang
  # 22.1.0+ requirement. Bump the tag to raise the pinned clang.
  LLVM_MINGW_TAG: "20260616"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install meson + ninja
        run: python -m pip install --upgrade meson ninja

      - name: Fetch llvm-mingw (Clang 22.1+)
        shell: pwsh
        run: |
          $tag = "${{ env.LLVM_MINGW_TAG }}"
          $zip = "llvm-mingw-$tag-ucrt-x86_64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/$tag/$zip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath C:\llvm-mingw -Force
          $bin = (Get-ChildItem C:\llvm-mingw -Directory | Select-Object -First 1).FullName + "\bin"
          Write-Host "llvm-mingw bin: $bin"
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "$bin\clang.exe" --version

      # Native Windows build via the repo's documented clang cross file. meson
      # marks the output non-runnable-on-host (needs_exe_wrapper) so `meson test`
      # is skipped, but the produced windows-gnu exe runs fine on this Windows
      # host — validated by the --version smoke below.
      - name: meson setup (clang cross file, release)
        shell: pwsh
        env:
          CC: clang
        run: meson setup build-win --cross-file toolchains/windows-x86_64-clang.ini --buildtype=release

      - name: meson compile ncc.exe
        shell: pwsh
        run: |
          meson compile -C build-win
          if (-not (Test-Path build-win\ncc.exe)) { throw "build-win\ncc.exe not produced" }

      - name: Smoke — ncc.exe runs on Windows
        shell: pwsh
        run: |
          & .\build-win\ncc.exe --version
          if ($LASTEXITCODE -ne 0) { throw "ncc.exe --version exited $LASTEXITCODE" }

      - name: Stage named asset
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,8)
          Copy-Item build-win\ncc.exe "ncc-$sha-windows-x64.exe"
          "NCC_ASSET=ncc-$sha-windows-x64.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload ncc.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ncc-windows-x64
          path: ${{ env.NCC_ASSET }}
          if-no-files-found: error
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        shell: pwsh
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.NCC_ASSET }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
